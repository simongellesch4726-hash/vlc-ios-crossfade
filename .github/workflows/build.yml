name: Build Crossfade

on:
  push:
    branches: ["crossfade-3.7.3"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
      THEOS_PACKAGE_SCHEME: roothide

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print -quit

      - name: Build Crossfade package
        run: |
          set -euxo pipefail
          make -C Crossfade clean
          make -C Crossfade package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:latest:15.0 ARCHS=arm64e

      - name: Verify artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          tweak_deb=(Crossfade/packages/com.videolan.vlc-ios.crossfade_*.deb)
          test "${#tweak_deb[@]}" -eq 1
          tweak="${tweak_deb[0]}"

          dylib="Crossfade/.theos/obj/arm64e/Crossfade.dylib"
          prefs_binary="Crossfade/.theos/obj/arm64e/CrossfadePrefs.bundle/CrossfadePrefs"
          test -f "$dylib"
          test -f "$prefs_binary"

          echo "==> Mach-O verification"
          tweak_macho_info="$(file "$dylib")"
          prefs_macho_info="$(file "$prefs_binary")"
          echo "$tweak_macho_info"
          echo "$prefs_macho_info"
          case "$tweak_macho_info" in
            *"Mach-O 64-bit arm64e"*) ;;
            *) echo "ERROR: Crossfade.dylib is not arm64e" >&2; exit 1 ;;
          esac
          case "$prefs_macho_info" in
            *"Mach-O 64-bit arm64e"*) ;;
            *) echo "ERROR: CrossfadePrefs is not arm64e" >&2; exit 1 ;;
          esac

          echo "==> Debian metadata verification"
          test "$(dpkg-deb -f "$tweak" Package)" = "com.videolan.vlc-ios.crossfade"
          test "$(dpkg-deb -f "$tweak" Architecture)" = "iphoneos-arm64e"

          echo "==> Package payload verification"
          rm -rf verify-tweak
          mkdir -p verify-tweak
          dpkg-deb -x "$tweak" verify-tweak

          echo "==> Extracted package tree"
          find verify-tweak -print | sort

          echo "==> Package file list"
          dpkg-deb -c "$tweak"

          echo "==> Locating payload files"
          dylib_matches=(verify-tweak/**/Crossfade.dylib)
          plist_matches=(verify-tweak/**/Crossfade.plist)
          prefs_matches=(verify-tweak/**/CrossfadePrefs.bundle/CrossfadePrefs)
          root_matches=(verify-tweak/**/CrossfadePrefs.bundle/Root.plist)
          info_matches=(verify-tweak/**/CrossfadePrefs.bundle/Info.plist)

          printf 'Crossfade.dylib: '; printf '%s\n' "${dylib_matches[@]:-<none>}"
          printf 'Crossfade.plist: '; printf '%s\n' "${plist_matches[@]:-<none>}"
          printf 'CrossfadePrefs: '; printf '%s\n' "${prefs_matches[@]:-<none>}"
          printf 'Root.plist: '; printf '%s\n' "${root_matches[@]:-<none>}"
          printf 'Info.plist: '; printf '%s\n' "${info_matches[@]:-<none>}"

          test "${#dylib_matches[@]}" -eq 1
          test "${#prefs_matches[@]}" -eq 1
          test "${#root_matches[@]}" -eq 1
          test "${#info_matches[@]}" -eq 1

          dylib_path="${dylib_matches[0]}"
          prefs_path="${prefs_matches[0]}"
          root_path="${root_matches[0]}"
          info_path="${info_matches[0]}"

          test -f "$dylib_path"
          test -x "$prefs_path"
          test -f "$root_path"
          test -f "$info_path"

          echo "==> Preference bundle verification"
          python3 - "$info_path" "$root_path" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          root = plistlib.loads(Path(sys.argv[2]).read_bytes())

          assert info.get("CFBundleExecutable") == "CrossfadePrefs", info
          assert info.get("CFBundlePackageType") == "BNDL", info
          assert info.get("NSPrincipalClass") == "CrossfadePrefsListController", info

          items = root.get("items")
          assert isinstance(items, list) and len(items) >= 2, root
          crossfade = next((x for x in items if x.get("key") == "CrossfadeDuration"), None)
          assert crossfade is not None, items
          assert crossfade.get("defaults") == "org.videolan.vlc-ios", crossfade
          assert len(crossfade.get("validValues", [])) == 16, crossfade
          assert len(crossfade.get("validTitles", [])) == 16, crossfade
          assert crossfade.get("validValues", [None])[0] == 0, crossfade
          assert crossfade.get("validValues", [None])[-1] == 15, crossfade
          assert crossfade.get("default") == 0, crossfade
          print("Preference bundle metadata verified.")
          PY

          echo "==> RootHide path verification"
          if find verify-tweak -type f -print0 | xargs -0 grep -IlE '(/jbroot|/var/jb)' 2>/dev/null | grep -q .; then
            echo "ERROR: invalid RootHide path found in package payload" >&2
            find verify-tweak -type f -print0 | xargs -0 grep -IlE '(/jbroot|/var/jb)' 2>/dev/null || true
            exit 1
          fi

          echo "Artifact verification passed."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crossfade-arm64e
          path: |
            Crossfade/packages/*.deb
            Crossfade/.theos/obj/arm64e/Crossfade.dylib
            Crossfade/.theos/obj/arm64e/CrossfadePrefs.bundle/CrossfadePrefs
