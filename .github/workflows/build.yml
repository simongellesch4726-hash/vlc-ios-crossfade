name: Build Crossfade
on:
  push:
    branches: ["crossfade-3.7.3"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install RootHide Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Verify toolchain
        run: |
          set -euo pipefail
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print -quit
      - name: Build Crossfade tweak
        run: |
          set -euxo pipefail
          make -C Crossfade clean
          make -C Crossfade package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:latest:15.0
      - name: Build preferences bundle
        run: |
          set -euxo pipefail
          make -C Preferences clean
          make -C Preferences package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:latest:15.0
      - name: Verify artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          tweak_deb=(Crossfade/packages/com.videolan.vlc-ios.crossfade_*.deb)
          pref_deb=(Preferences/packages/*.deb)
          test "${#tweak_deb[@]}" -eq 1
          test "${#pref_deb[@]}" -eq 1
          test -f Crossfade/.theos/obj/arm64/Crossfade.dylib
          dpkg-deb -I "${tweak_deb[0]}"
          dpkg-deb -c "${tweak_deb[0]}"
          dpkg-deb -I "${pref_deb[0]}"
          dpkg-deb -c "${pref_deb[0]}"
          file Crossfade/.theos/obj/arm64/Crossfade.dylib
          file "${tweak_deb[0]}"
          ! dpkg-deb -c "${tweak_deb[0]}" | grep -E '(/jbroot|/var/jb)' || true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crossfade-arm64
          path: |
            Crossfade/packages/*.deb
            Preferences/packages/*.deb
            Crossfade/.theos/obj/arm64/Crossfade.dylib
