name: Build Crossfade
on:
  push:
    branches: ["crossfade-3.7.3"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: /home/runner/theos
      THEOS_PACKAGE_SCHEME: roothide
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install RootHide Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
      - name: Verify toolchain
        run: |
          set -euo pipefail
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print -quit
      - name: Build Crossfade package
        run: |
          set -euxo pipefail
          make -C Crossfade clean
          make -C Crossfade package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:latest:15.0
      - name: Verify artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          tweak_deb=(Crossfade/packages/com.videolan.vlc-ios.crossfade_*.deb)
          test "${#tweak_deb[@]}" -eq 1
          tweak="${tweak_deb[0]}"
          dylib="Crossfade/.theos/obj/arm64e/Crossfade.dylib"
          test -f "$dylib"

          echo "==> Mach-O verification"
          macho_info="$(file "$dylib")"
          echo "$macho_info"
          case "$macho_info" in
            *"Mach-O 64-bit arm64e"*) ;;
            *) echo "ERROR: Crossfade.dylib is not arm64e" >&2; exit 1 ;;
          esac

          echo "==> Debian metadata verification"
          test "$(dpkg-deb -f "$tweak" Package)" = "com.videolan.vlc-ios.crossfade"
          test "$(dpkg-deb -f "$tweak" Architecture)" = "iphoneos-arm64e"

          echo "==> Package payload verification"
          rm -rf verify-tweak
          mkdir -p verify-tweak
          dpkg-deb -x "$tweak" verify-tweak
          test -f "verify-tweak/Library/MobileSubstrate/DynamicLibraries/Crossfade.dylib"
          test -f "verify-tweak/Library/MobileSubstrate/DynamicLibraries/Crossfade.plist"
          test -f "verify-tweak/Library/PreferenceLoader/Preferences/CrossfadePrefs.plist"
          test -x "verify-tweak/Library/PreferenceBundles/CrossfadePrefs.bundle/CrossfadePrefs"
          test -f "verify-tweak/Library/PreferenceBundles/CrossfadePrefs.bundle/Info.plist"
          test -f "verify-tweak/Library/PreferenceBundles/CrossfadePrefs.bundle/Root.plist"

          if find verify-tweak -type f -print0 | xargs -0 grep -IlE '(/jbroot|/var/jb)' 2>/dev/null | grep -q .; then
            echo "ERROR: invalid RootHide path found in package payload" >&2
            exit 1
          fi

          echo "==> Package contents"
          dpkg-deb -I "$tweak"
          dpkg-deb -c "$tweak"
          echo "Artifact verification passed."
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crossfade-arm64e
          path: |
            Crossfade/packages/*.deb
            Crossfade/.theos/obj/arm64e/Crossfade.dylib
